<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WatchParty</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0d12; color: #e7e9ee; height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 10px 14px; background: #12151c; border-bottom: 1px solid #1e2330;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 600; margin-right: auto; }
  button { background: #2a3345; color: #e7e9ee; border: none; padding: 8px 14px;
    border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:hover { background: #37425a; }
  button.primary { background: #4a63ff; }
  button.primary:hover { background: #5f76ff; }
  input[type=text], input[type=url] { background: #12151c; border: 1px solid #2a3345;
    color: #e7e9ee; padding: 8px 12px; border-radius: 8px; font-size: 14px; outline: none; }
  input:focus { border-color: #4a63ff; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #000; }
  #videoWrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  video { max-width: 100%; max-height: 100%; width: 100%; background: #000; }
  #controls { padding: 8px 12px; background: #12151c; border-top: 1px solid #1e2330;
    display: flex; gap: 8px; align-items: center; }
  #controls input[type=range] { flex: 1; }
  #time { font-variant-numeric: tabular-nums; font-size: 13px; color: #9aa3b8;
    min-width: 90px; text-align: center; }
  #roomBar { display: flex; gap: 8px; align-items: center; }
  #roomCode { font-weight: 700; color: #8fa2ff; letter-spacing: 2px; }
  #side { width: 300px; display: flex; flex-direction: column; background: #12151c;
    border-left: 1px solid #1e2330; min-height: 0; }
  #chatLog { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; }
  .msg { margin-bottom: 8px; line-height: 1.35; word-wrap: break-word; }
  .msg .who { color: #8fa2ff; font-weight: 600; }
  .msg.system { color: #6b7488; font-style: italic; font-size: 12px; }
  #chatForm { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #1e2330; }
  #chatForm input { flex: 1; }
  #setup { position: fixed; inset: 0; background: rgba(6,8,12,.93); display: flex;
    align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .panel { background: #12151c; border: 1px solid #1e2330; border-radius: 14px;
    padding: 24px; width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 14px; }
  .panel h2 { font-size: 20px; }
  .panel p { font-size: 13px; color: #9aa3b8; line-height: 1.5; }
  .row { display: flex; gap: 8px; }
  .row > input { flex: 1; }
  .hidden { display: none !important; }
  #status { font-size: 12px; color: #6b7488; }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #side { width: 100%; height: 40dvh; border-left: none; border-top: 1px solid #1e2330; }
    header h1 { font-size: 14px; }
  }
</style>
</head>
<body>

<header>
  <h1>WatchParty</h1>
  <div id="roomBar" class="hidden">
    <span>Room:</span><span id="roomCode">------</span>
    <button id="copyRoom">Copy</button>
    <span id="status">connecting…</span>
  </div>
</header>

<main>
  <div id="stage">
    <div id="videoWrap"><video id="video" playsinline controls></video></div>
    <div id="controls" class="hidden">
      <input type="range" id="seek" min="0" max="1000" value="0" />
      <span id="time">0:00 / 0:00</span>
    </div>
  </div>
  <aside id="side">
    <div id="chatLog"></div>
    <form id="chatForm"><input type="text" id="chatInput" placeholder="Message…" autocomplete="off" /></form>
  </aside>
</main>

<div id="setup">
  <div class="panel">
    <h2>Start a Watch Party</h2>
    <p>Host picks a local file or pastes a direct video URL. Share the room code. Everyone watches in sync.</p>
    <div class="row">
      <button class="primary" id="btnCreate">Create room (Host)</button>
      <button id="btnJoinToggle">Join with code</button>
    </div>
    <div id="joinRow" class="row hidden">
      <input type="text" id="joinCode" placeholder="ROOM CODE" maxlength="8" style="text-transform:uppercase" />
      <button class="primary" id="btnJoin">Join</button>
    </div>
    <label style="font-size:13px;color:#9aa3b8">Your name</label>
    <input type="text" id="myName" placeholder="Guest" value="Guest" />
    <div id="setupErr" style="color:#ff6b6b;font-size:13px"></div>
  </div>
</div>

<div id="mediaPicker" class="hidden" style="position:fixed;inset:0;background:rgba(6,8,12,.93);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;">
  <div class="panel">
    <h2>Select media</h2>
    <p>Local file or a direct link to a video you have the right to stream.</p>
    <input type="file" id="filePick" accept="video/*,audio/*" />
    <div style="text-align:center;color:#6b7488;font-size:13px;">— or —</div>
    <input type="url" id="urlPick" placeholder="https://…/movie.mp4" />
    <button class="primary" id="btnLoadMedia">Load &amp; share</button>
    <div id="mediaErr" style="color:#ff6b6b;font-size:13px"></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const video = $('video');
  const seek = $('seek');
  const timeEl = $('time');
  const chatLog = $('chatLog');
  const chatForm = $('chatForm');
  const chatInput = $('chatInput');

  let ws = null, myId = null, room = null, isHost = false, myName = 'Guest';
  const peers = new Map();
  const pendingIce = new Map();

  const RTC_CONFIG = { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]};

  // auto-detect websocket url from page origin — no field needed
  function wsUrl() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    return proto + '//' + location.host;
  }

  const logSystem = (t) => {
    const d = document.createElement('div'); d.className = 'msg system'; d.textContent = t;
    chatLog.appendChild(d); chatLog.scrollTop = chatLog.scrollHeight;
  };
  const logChat = (who, text) => {
    const d = document.createElement('div'); d.className = 'msg';
    const w = document.createElement('span'); w.className = 'who'; w.textContent = who + ': ';
    d.appendChild(w); d.appendChild(document.createTextNode(text));
    chatLog.appendChild(d); chatLog.scrollTop = chatLog.scrollHeight;
  };
  const setStatus = (s) => { $('status').textContent = s; };
  const fmtTime = (t) => {
    if (!isFinite(t)) return '0:00';
    const m = Math.floor(t / 60), s = Math.floor(t % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  };

  function attachLocalMedia(src) {
    video.src = src; video.controls = true; video.play().catch(() => {});
    $('controls').classList.remove('hidden');
    video.addEventListener('loadedmetadata', () => {
      if (isHost) {
        let stream;
        try { stream = video.captureStream ? video.captureStream() : video.mozCaptureStream(); } catch {}
        if (stream) for (const [, { pc }] of peers)
          stream.getTracks().forEach(t => { try { pc.addTrack(t, stream); } catch {} });
        logSystem('Streaming to peers.');
      }
    }, { once: true });
  }

  function handleRemoteTrack(event) {
    const [stream] = event.streams;
    if (!stream) return;
    video.srcObject = stream; video.controls = false;
    $('controls').classList.remove('hidden');
    logSystem('Receiving stream from host…');
  }

  function createPC(remoteId) {
    const pc = new RTCPeerConnection(RTC_CONFIG);
    const dc = pc.createDataChannel('sync');
    wireDataChannel(dc);
    pc.onicecandidate = (e) => { if (e.candidate) send({ type: 'ice', to: remoteId, candidate: e.candidate }); };
    pc.ontrack = handleRemoteTrack;
    pc.ondatachannel = (e) => wireDataChannel(e.channel);
    peers.set(remoteId, { pc, dc });
    return pc;
  }

  function wireDataChannel(dc) {
    dc.onopen = () => { if (isHost && video.currentTime)
      dc.send(JSON.stringify({ type: 'sync', action: 'state', t: video.currentTime, paused: video.paused })); };
    dc.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === 'chat') logChat(m.name || 'Guest', m.text);
      else if (m.type === 'sync') handleSync(m);
    };
  }

  function connect(onOpen) {
    ws = new WebSocket(wsUrl());
    ws.onopen = () => { setStatus('connected'); onOpen && onOpen(); };
    ws.onclose = () => setStatus('disconnected');
    ws.onerror = () => setStatus('error');
    ws.onmessage = async (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      switch (m.type) {
        case 'created':
          myId = m.id; room = m.room; isHost = true;
          $('roomCode').textContent = room; $('roomBar').classList.remove('hidden');
          $('setup').classList.add('hidden'); $('mediaPicker').classList.remove('hidden');
          logSystem('Room created: ' + room);
          break;
        case 'joined':
          myId = m.id; room = m.room; isHost = false;
          $('roomCode').textContent = room; $('roomBar').classList.remove('hidden');
          $('setup').classList.add('hidden');
          logSystem('Joined room ' + room);
          break;
        case 'peer-joined':
          logSystem('Peer joined: ' + m.id.slice(0, 4));
          if (isHost) await makeOffer(m.id);
          break;
        case 'offer': {
          const pc = createPC(m.from);
          await pc.setRemoteDescription(m.sdp);
          await flushIce(m.from, pc);
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          send({ type: 'answer', to: m.from, sdp: answer });
          break;
        }
        case 'answer': {
          const p = peers.get(m.from);
          if (p) await p.pc.setRemoteDescription(m.sdp);
          break;
        }
        case 'ice': {
          const p = peers.get(m.from);
          if (p && p.pc.remoteDescription) { try { await p.pc.addIceCandidate(m.candidate); } catch {} }
          else { if (!pendingIce.has(m.from)) pendingIce.set(m.from, []); pendingIce.get(m.from).push(m.candidate); }
          break;
        }
        case 'peer-left': {
          const p = peers.get(m.from);
          if (p) { try { p.pc.close(); } catch {} peers.delete(m.from); }
          logSystem('Peer left: ' + m.from.slice(0, 4));
          break;
        }
        case 'error': $('setupErr').textContent = m.msg; break;
        case 'chat': logChat(m.name || 'Guest', m.text); break;
        case 'sync': handleSync(m); break;
      }
    };
  }

  async function flushIce(remoteId, pc) {
    const list = pendingIce.get(remoteId) || []; pendingIce.delete(remoteId);
    for (const c of list) { try { await pc.addIceCandidate(c); } catch {} }
  }

  async function makeOffer(remoteId) {
    const pc = createPC(remoteId);
    if (video.src) {
      try {
        const stream = video.captureStream ? video.captureStream() : null;
        if (stream) stream.getTracks().forEach(t => pc.addTrack(t, stream));
      } catch {}
    }
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    send({ type: 'offer', to: remoteId, sdp: offer });
  }

  const send = (obj) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); };
  const broadcast = (obj) => {
    for (const [, { dc }] of peers)
      if (dc && dc.readyState === 'open') { try { dc.send(JSON.stringify(obj)); } catch {} }
  };

  function hostBroadcastState() {
    if (!isHost) return;
    broadcast({ type: 'sync', action: 'state', t: video.currentTime, paused: video.paused });
  }

  function handleSync(m) {
    if (isHost) return;
    if (m.action === 'state') {
      if (Math.abs(video.currentTime - m.t) > 1.0) video.currentTime = m.t;
      if (m.paused && !video.paused) video.pause();
      if (!m.paused && video.paused) video.play().catch(() => {});
    }
  }

  video.addEventListener('play', () => { if (isHost) hostBroadcastState(); });
  video.addEventListener('pause', () => { if (isHost) hostBroadcastState(); });
  video.addEventListener('seeked', () => { if (isHost) hostBroadcastState(); });
  video.addEventListener('timeupdate', () => {
    seek.value = Math.floor((video.currentTime / (video.duration || 1)) * 1000);
    timeEl.textContent = fmtTime(video.currentTime) + ' / ' + fmtTime(video.duration);
  });
  seek.addEventListener('input', () => {
    if (!isHost) return;
    video.currentTime = (seek.value / 1000) * (video.duration || 0);
    hostBroadcastState();
  });

  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = chatInput.value.trim(); if (!text) return;
    chatInput.value = ''; logChat(myName, text);
    const msg = { type: 'chat', name: myName, text };
    broadcast(msg); send(msg);
  });

  $('btnCreate').addEventListener('click', () => {
    myName = $('myName').value.trim() || 'Host';
    connect(() => send({ type: 'create' }));
  });
  $('btnJoinToggle').addEventListener('click', () => $('joinRow').classList.toggle('hidden'));
  $('btnJoin').addEventListener('click', () => {
    myName = $('myName').value.trim() || 'Guest';
    const code = $('joinCode').value.trim().toUpperCase(); if (!code) return;
    connect(() => send({ type: 'join', room: code }));
  });
  $('copyRoom').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(room); logSystem('Room code copied'); } catch {}
  });
  $('btnLoadMedia').addEventListener('click', () => {
    const file = $('filePick').files[0];
    const url = $('urlPick').value.trim();
    $('mediaErr').textContent = '';
    if (file) { attachLocalMedia(URL.createObjectURL(file)); $('mediaPicker').classList.add('hidden'); return; }
    if (url) { attachLocalMedia(url); $('mediaPicker').classList.add('hidden'); return; }
    $('mediaErr').textContent = 'Pick a file or paste a URL.';
  });
})();
</script>
</body>
</html>
